name: CI Pipeline

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Chrome
      run: |
        sudo apt update
        sudo apt install -y google-chrome-stable

    - name: Install Dependencies
      run: |
        pip install flask selenium pytest webdriver-manager

    - name: Start Flask App
      run: |
        nohup python app.py > flask.log 2>&1 &
    
    - name: Wait for Flask to Start
      run: |
        for i in {1..15}; do
          curl http://127.0.0.1:5000 && break
          echo "Waiting for app..."
          sleep 2
        done

    - name: Run Tests
      run: |
        python -m pytest -p no:anyio