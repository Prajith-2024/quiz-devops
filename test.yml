name: CI Pipeline

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Chrome
      run: |
        sudo apt update
        sudo apt install -y google-chrome-stable

    - name: Install dependencies
      run: pip install flask selenium pytest webdriver-manager

    - name: Start Flask App
      run: |
        python app.py &
        sleep 5

    - name: Run Tests
      run: python -m pytest -p no:anyio